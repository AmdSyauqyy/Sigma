<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGMA Care | Jarak halangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>
:root{--base:#3A455F;--deep:#2E374D;--bg:#F4F5F8;--line:rgba(255,255,255,.22);--ok:#3DBE7A;--warn:#F2B84B}
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:#1d2333;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;background:#fff;
  padding-bottom:max(24px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:9px;padding:max(14px,env(safe-area-inset-top)) 18px 14px;
  font-weight:800;color:var(--base);font-size:1.05rem}
.logo{width:40px;height:40px;border-radius:9px;background:var(--base);color:#fff;display:grid;
  place-items:center;font-size:24px;font-weight:700}
.stack{padding:4px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--base);color:#fff;border-radius:16px;padding:16px;transition:background .25s}
.card h2{font-size:.8rem;font-weight:700;margin-bottom:10px}

.head{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.head b{font-size:.95rem}.head small{display:block;font-size:.75rem;opacity:.85;margin-top:2px}
.badge{font-size:.72rem;font-weight:700;padding:5px 11px;border-radius:99px;
  background:#dff5e8;color:#157a45;white-space:nowrap}
.badge.warn{background:#fdf0cf;color:#8a5a00}
.badge.off{background:#e6e8ee;color:#555d73}
.pair{display:flex;justify-content:space-between;padding-top:12px;font-size:.72rem}
.pair span{display:block;opacity:.8;margin-bottom:3px}
.pair b{font-size:.8rem;font-variant-numeric:tabular-nums}
.pair div:last-child{text-align:right}

.dist{display:flex;align-items:baseline;gap:6px}
#num{font-size:4rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
#num.off{font-size:1.4rem;letter-spacing:0;opacity:.8}
#unit{opacity:.8;font-size:1.05rem}
#msg{margin-top:8px;font-size:.85rem;opacity:.9}
.bar{position:relative;height:12px;background:var(--deep);border-radius:9px;margin:16px 0 6px;overflow:hidden}
.bar .z{position:absolute;inset:0 auto 0 0;width:12.5%;
  background:repeating-linear-gradient(135deg,var(--warn) 0 5px,transparent 5px 10px);opacity:.55}
#fill{position:absolute;inset:0 auto 0 0;width:0;background:#fff;border-radius:9px;opacity:.92;
  transition:width .15s linear}
.scale{display:flex;justify-content:space-between;font-size:.68rem;opacity:.75}

.card.near{background:#5B4F2E}
.card.near #fill{background:var(--warn)}

table{width:100%;border-collapse:collapse;font-size:.78rem}
th{text-align:left;font-weight:700;padding:0 0 8px;border-bottom:1px solid var(--line)}
td{padding:8px 0;font-variant-numeric:tabular-nums}
th:last-child,td:last-child{text-align:right}
tr.live td{background:var(--warn);color:#2b2410;font-weight:700}
tr.live td:first-child{padding-left:8px}tr.live td:last-child{padding-right:8px}
.empty{text-align:center;opacity:.8;font-size:.8rem;padding:22px 0 8px}
.hidden{display:none}
.conn{font-size:.72rem;color:#6b7390;text-align:center;display:flex;gap:7px;justify-content:center;
  align-items:center;margin-top:2px}
.conn i{width:8px;height:8px;border-radius:50%;background:#aab}
.conn i.on{background:var(--ok)}.conn i.err{background:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">Σ</div>SIGMA Care</div>

  <div class="stack">
    <div class="card">
      <div class="head">
        <div><b>Tongkat SIGMA</b><small>Sistem pemantauan jarak halangan</small></div>
        <span class="badge off" id="badge">Menunggu</span>
      </div>
      <div class="pair">
        <div><span>Sinyal masuk</span><b id="sig">--:--:--</b></div>
        <div><span>Batas peringatan</span><b>50 cm</b></div>
      </div>
    </div>

    <div class="card" id="distCard">
      <h2>Jarak halangan di depan</h2>
      <div class="dist"><span id="num">--</span><span id="unit">cm</span></div>
      <p id="msg">Menunggu data dari tongkat</p>
      <div class="bar"><div class="z"></div><div id="fill"></div></div>
      <div class="scale"><span>0</span><span>100</span><span>200</span><span>300</span><span>400 cm</span></div>
    </div>

    <div class="card">
      <h2>Riwayat peringatan halangan</h2>
      <table>
        <thead><tr><th>Waktu</th><th>Status</th><th>Jarak</th></tr></thead>
        <tbody id="hist"></tbody>
      </table>
      <p class="empty" id="histEmpty">Belum ada peringatan halangan</p>
    </div>

    <p class="conn"><i id="dot"></i><span id="conn">Menghubungkan ke Firebase</span></p>
  </div>
</div>

<script>
// Samakan dengan URL di tab Data Firebase Anda
const DB_URL = "https://sigma-d48ff-default-rtdb.asia-southeast1.firebasedatabase.app/sigma.json";
const MAX = 400, KEEP = 15;
const $ = id => document.getElementById(id);

let state = {}, prevWarn = false, minDist = null, events = [];

function conn(k, t){ $('dot').className = k; $('conn').textContent = t; }

function render(){
  const d = Number(state.distance);
  const none = !(d >= 0) || state.distance == null;
  const near = state.warning === true && !none;

  $('sig').textContent = new Date().toTimeString().slice(0, 8);

  const num = $('num');
  num.classList.toggle('off', none);
  num.textContent = none ? 'Di luar jangkauan' : d.toFixed(1);
  $('unit').classList.toggle('hidden', none);
  $('fill').style.width = none ? '0' : Math.min(d, MAX) / MAX * 100 + '%';
  $('distCard').classList.toggle('near', near);

  const b = $('badge');
  b.className = 'badge' + (near ? ' warn' : '');
  b.textContent = near ? 'Halangan dekat' : 'Aman';
  $('msg').textContent = none ? 'Tidak ada pantulan dalam 4 meter'
    : near ? 'Ada halangan, jaraknya kurang dari 50 cm' : 'Jalur di depan aman';

  // riwayat: satu baris per kejadian halangan, jarak terdekatnya yang dicatat
  if (near) {
    if (!prevWarn) {
      events.unshift({ t: new Date().toTimeString().slice(0, 8), d });
      events = events.slice(0, KEEP);
    } else if (events.length && d < events[0].d) {
      events[0].d = d;
    }
  }
  prevWarn = near;
  renderHist(near);
}

function renderHist(active){
  $('histEmpty').classList.toggle('hidden', events.length > 0);
  $('hist').innerHTML = events.map((e, i) =>
    '<tr class="' + (active && i === 0 ? 'live' : '') + '"><td>' + e.t + '</td><td>' +
    (active && i === 0 ? 'Terdeteksi' : 'Selesai') + '</td><td>' + e.d.toFixed(1) + ' cm</td></tr>'
  ).join('');
}

const es = new EventSource(DB_URL);
es.addEventListener('put', e => {
  const m = JSON.parse(e.data);
  if (m.path === '/') { if (m.data) state = m.data; }
  else state[m.path.slice(1)] = m.data;
  conn('on', 'Terhubung, data masuk langsung');
  render();
});
es.addEventListener('patch', e => { Object.assign(state, JSON.parse(e.data).data); render(); });
es.onerror = () => conn('err', 'Koneksi terputus, mencoba lagi');
</script>
</body>
</html>
